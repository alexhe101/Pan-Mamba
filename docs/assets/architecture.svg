dth="191" height="105" rx="13" fill="#fff" stroke="#386778" stroke-opacity=".5"/><text x="762.5" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3342">5 CrossMamba blocks</text><text x="762.5" y="142" text-anchor="middle" font-size="12" fill="#587080">Original fused kernel</text><path d="M858 125h20" stroke="#386778" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="880" y="73" width="191" height="105" rx="13" fill="#386778" stroke="#386778" stroke-opacity=".5"/><text x="975.5" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Refine + MS residual</text><text x="975.5" y="142" text-anchor="middle" font-size="12" fill="#fff">4-band HRMS</text><text x="28" y="212" font-size="13" fill="#587080">Inputs: co-registered LRMS (4 bands) and PAN (1 band) · Output: HRMS at 4× spatial scale</text></g></svg>